name: Build release draft

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install build tools
        run: python -m pip install --disable-pip-version-check uv
      - name: Install locked dependencies
        run: |
          uv sync --extra dev
          npm --prefix ui ci
      - name: Verify tag and source
        run: |
          uv run python tools/check_release_tag.py --tag "$GITHUB_REF_NAME"
          npm --prefix ui run test
          npm --prefix ui run build
          uv run pytest
      - name: Build artifacts
        run: |
          uv build
          uv run python tools/build_skill_package.py --output-dir dist
          cd dist
          sha256sum chanlun_visual-* chanlun-trading-system-skill.zip > SHA256SUMS
      - name: Verify wheel artifact
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --disable-pip-version-check dist/chanlun_visual-*.whl
          .release-venv/bin/chanlun-visual --version
          .release-venv/bin/chanlun-visual doctor --json
      - name: Create reviewable GitHub Release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/chanlun_visual-* \
            dist/chanlun-trading-system-skill.zip \
            dist/SHA256SUMS \
            --draft \
            --generate-notes \
            --title "Chanlun Visual $GITHUB_REF_NAME" \
            --verify-tag
