name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install build tools
        run: python -m pip install --disable-pip-version-check uv
      - name: Install locked Python dependencies
        run: uv sync --extra dev
      - name: Install locked frontend dependencies
        run: npm --prefix ui ci
      - name: Verify frontend
        run: |
          npm --prefix ui run test
          npm --prefix ui run lint
          npm --prefix ui run build
          npm --prefix ui audit --audit-level=high
      - name: Verify Python and distribution contracts
        run: uv run pytest
      - name: Build release artifacts
        run: |
          uv build
          uv run python tools/build_skill_package.py --output-dir dist
      - name: Verify clean wheel install
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --disable-pip-version-check dist/chanlun_visual-*.whl
          .release-venv/bin/chanlun-visual --version
          .release-venv/bin/chanlun-visual doctor --json
          .release-venv/bin/python -c "from chanlun_visual.api import health; assert health()['status'] == 'ok'"
